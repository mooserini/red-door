<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Resonant Mirror</title><link rel="stylesheet" href="/mirror.css"><script src="/assets/projects-core.v1.js" defer></script><script type="module" src="/mirror.js"></script></head><body>
<div class="crt" id="crt">
  <div class="screen" id="screen"></div>
  <div class="input-row hide" id="inputRow"><span id="cmdline"></span><span class="hint hide" id="hint">type a command (try: help)</span></div>
  <button class="rom-btn hide" id="romBtn">Enter Mirror</button>
  <div class="btn-tree hide" id="tree"></div>
  <div class="mobile-prompt hide" id="mobilePrompt">C:/&gt; <span class="cursor"></span></div>
  <form id="terminalCommands" autocomplete="off">
    <input id="cmd" class="terminal-input" name="terminal-command" type="text" aria-label="Terminal command" autocomplete="off" spellcheck="false">
  </form>
  <form id="doorCredentials" autocomplete="on" hidden>
    <input id="doorHandle" class="terminal-input" name="username" type="text" aria-label="Handle" autocomplete="username" spellcheck="false" autocapitalize="none" maxlength="20" hidden>
    <input id="doorPassword" class="terminal-input" name="password" type="password" aria-label="Password" autocomplete="current-password" maxlength="128" hidden>
    <input id="doorConfirm" class="terminal-input" name="password-confirmation" type="password" aria-label="Confirm password" autocomplete="new-password" maxlength="128" hidden>
  </form>
</div>
</body></html>
